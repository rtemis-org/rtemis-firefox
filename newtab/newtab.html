<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>▶</title>
  <link rel="icon" type="image/svg+xml" href="../icons/favicon.svg">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>

  <!-- Top-left: clock + date -->
  <section class="card card-clock" id="clock-card" aria-label="Clock">
    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-date" id="clock-date"></div>
  </section>

  <!-- Top-right: weather -->
  <section class="card card-weather" id="weather-card" aria-label="Weather" data-state="loading">

    <!-- Loading -->
    <div class="weather-state weather-loading">
      <div class="skeleton sk-line w-60"></div>
      <div class="skeleton sk-temp"></div>
      <div class="skeleton sk-line w-80"></div>
      <div class="skeleton sk-line w-40"></div>
    </div>

    <!-- Location setup -->
    <div class="weather-state weather-setup">
      <div class="setup-title">Weather</div>
      <div class="setup-hint">Set a location to see current conditions.</div>
      <form class="setup-form" id="setup-form" autocomplete="off">
        <input type="search" id="city-input" placeholder="Search city…" aria-label="Search city" spellcheck="false">
        <ul class="city-results" id="city-results" role="listbox"></ul>
      </form>
      <button type="button" class="btn-ghost" id="use-geo">Use my location</button>
      <button type="button" class="btn-link" id="setup-cancel" hidden>Cancel</button>
      <div class="setup-error" id="setup-error"></div>
    </div>

    <!-- Live data -->
    <div class="weather-state weather-live">
      <header class="weather-head">
        <span class="weather-place" id="w-place"></span>
        <span class="head-actions">
        <button type="button" class="icon-btn" id="w-refresh" title="Refresh" aria-label="Refresh weather">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="w-settings" title="Change location" aria-label="Change location">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2.1-1.7a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.7a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.2 0 .4-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13Z"/></svg>
        </button>
        </span>
      </header>

      <div class="weather-main">
        <div class="weather-icon" id="w-icon" aria-hidden="true"></div>
        <div class="weather-temps">
          <div class="temp-row">
            <span class="temp-c" id="w-temp-c">--</span><span class="unit">°C</span>
            <span class="temp-sep">/</span>
            <span class="temp-f" id="w-temp-f">--</span><span class="unit">°F</span>
          </div>
          <div class="weather-cond" id="w-cond"></div>
        </div>
      </div>

      <dl class="weather-grid">
        <div><dt>Feels like</dt><dd id="w-feels"></dd></div>
        <div><dt>High / Low</dt><dd id="w-hilo"></dd></div>
        <div><dt>Humidity</dt><dd id="w-hum"></dd></div>
        <div><dt>Wind <span id="w-wind-dir"></span></dt><dd id="w-wind"></dd></div>
      </dl>

      <footer class="weather-foot">
        <span id="w-updated"></span>
        <span class="stale-badge" id="w-stale" hidden>offline · cached</span>
      </footer>
    </div>
  </section>

  <!-- Center: logomark + links -->
  <main class="hero">
    <div class="brand">
    <a class="logomark" href="https://www.rtemis.org" title="rtemis" aria-label="rtemis">

    </a>
    <nav class="links" aria-label="rtemis links">
      <a href="https://www.rtemis.org">www.rtemis.org</a>
      <a href="https://live.rtemis.org">live.rtemis.org</a>
      <a href="https://github.com/rtemis-org">github.com/rtemis-org</a>
    </nav>
    </div>

    <!-- Search: uses Firefox's installed search engines -->
    <form class="search" id="search-form" role="search" autocomplete="off">
      <button type="button" class="engine-btn" id="engine-btn" aria-haspopup="listbox" aria-expanded="false" title="Change search engine" aria-label="Change search engine">
        <img class="engine-icon" id="engine-icon" alt="" width="16" height="16" hidden>
        <svg class="engine-glass" id="engine-glass" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M11.5 11.5 15 15M7 12.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11Z"/></svg>
        <svg class="chev" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6l4 4 4-4"/></svg>
      </button>
      <input type="text" id="search-input" placeholder="Search or enter address" aria-label="Search" spellcheck="false">
      <ul class="engine-menu" id="engine-menu" role="listbox" aria-label="Search engines" hidden></ul>
    </form>
  </main>

  <!-- Bottom-left: theme mode -->
  <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="Theme">
    <button type="button" role="radio" aria-checked="false" data-mode="system">System</button>
    <button type="button" role="radio" aria-checked="false" data-mode="light">Light</button>
    <button type="button" role="radio" aria-checked="false" data-mode="dark">Dark</button>
  </div>

  <script src="weather.js"></script>
  <script src="search.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
