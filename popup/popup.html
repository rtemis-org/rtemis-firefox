<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rtemis</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header class="head">
    <img class="mark" src="../icons/favicon.svg" width="20" height="20" alt="">
    <span class="title">rtemis</span>
  </header>

  <!-- Theme mode: same storage key as the new tab switcher -->
  <section class="section">
    <div class="label">Theme</div>
    <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" aria-checked="false" data-mode="system">System</button>
      <button type="button" role="radio" aria-checked="false" data-mode="light">Light</button>
      <button type="button" role="radio" aria-checked="false" data-mode="dark">Dark</button>
    </div>
  </section>

  <nav class="section links" aria-label="rtemis sites">
    <a class="row" href="https://www.rtemis.org">
      <span>rtemis.org</span><span class="url">www.rtemis.org</span>
    </a>
    <a class="row" href="https://live.rtemis.org">
      <span>rtemis live</span><span class="url">live.rtemis.org</span>
    </a>
  </nav>

  <details class="section docs" id="docs">
    <summary class="row">
      <span>Docs</span>
      <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 6l4 4 4-4"/></svg>
    </summary>
    <div class="docs-list">
      <a class="doc" href="https://docs.rtemis.org">
        <span class="doc-name">docs.rtemis.org</span>
      </a>
      <div class="doc-group">R</div>
      <div class="doc">
        <span class="doc-name">rtemis <span class="dim">ML</span></span>
        <span class="doc-links">
          <a href="https://docs.rtemis.org/r/ml">Guide</a>
          <a href="https://docs.rtemis.org/r/ml-api">API</a>
        </span>
      </div>
      <div class="doc">
        <span class="doc-name">rtemis.llm</span>
        <span class="doc-links">
          <a href="https://docs.rtemis.org/r/llm">Guide</a>
          <a href="https://docs.rtemis.org/r/llm-api">API</a>
        </span>
      </div>
      <div class="doc">
        <span class="doc-name">rtemis.draw</span>
        <span class="doc-links">
          <a href="https://docs.rtemis.org/r/draw">Guide</a>
          <a href="https://docs.rtemis.org/r/draw-api">API</a>
        </span>
      </div>
      <div class="doc">
        <span class="doc-name">curriculum</span>
        <span class="doc-links">
          <a href="https://docs.rtemis.org/r/curriculum">Guide</a>
          <a href="https://docs.rtemis.org/r/curriculum-api">API</a>
        </span>
      </div>
      <div class="doc-group">CLI</div>
      <div class="doc">
        <span class="doc-name">rtemis CLI</span>
        <span class="doc-links">
          <a href="https://docs.rtemis.org/cli">Guide</a>
        </span>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
